server {
    listen 80;
    server_name pirisahr.com www.pirisahr.com 167.172.95.86;

    root /var/www/html;
    index index.html index.htm;

    location ~ ^/(api|login|employee|user|company|company_leave|companyOT|department|designation|allowance|bonus|attendance|emp_leave|leave_balance|payrole|apit|document|logo|calendar|actuator)(/|$) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_origin $cors_origin {
    default "";
    "http://pirisahr.com" $http_origin;
    "https://pirisahr.com" $http_origin;
    "http://www.pirisahr.com" $http_origin;
    "https://www.pirisahr.com" $http_origin;
    "http://167.172.95.86" $http_origin;
}
