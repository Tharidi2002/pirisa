name: Deploy PirisaHRM to Droplet

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Backend uses Java 21 as declared in hrm-backend/pom.xml.
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and test backend with Maven
        run: |
          cd hrm-backend
          mvn clean verify
          ls -la target/

      # Node.js Frontend Setup & Build
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: hrm-frontend/package-lock.json

      - name: Validate attendance OpenAPI contract
        run: npx --yes @redocly/cli@2.59.0 lint docs/openapi/attendance.yaml

      - name: Install Frontend Dependencies
        run: npm install --prefix hrm-frontend

      - name: Build Frontend
        run: npm run build --prefix hrm-frontend

      # SSH & Deployment to Droplet
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: "just-a-placeholder-so-we-dont-get-errors"

      - name: Add Droplet to Known Hosts
        run: ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Deploy files via SCP
        run: |
          # Deploy Backend .jar file (පළවෙනි .jar එක හොයාගන්න)
          JAR_FILE=$(ls hrm-backend/target/*.jar | head -1)
          scp -o StrictHostKeyChecking=no "$JAR_FILE" ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }}:/root/app.jar

          # Deploy Frontend build files
          ssh -o StrictHostKeyChecking=no ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }} "mkdir -p /var/www/html && rm -rf /var/www/html/*"
          scp -r -o StrictHostKeyChecking=no hrm-frontend/dist/* ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }}:/var/www/html/

      - name: Restart Backend Service on Droplet
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }} "systemctl restart hrm-backend"
