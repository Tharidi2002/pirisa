services:
  mysql:
    image: mysql:8.4
    container_name: hrm-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: HRM
      MYSQL_USER: hrm_user
      MYSQL_PASSWORD: hrm_local_password
      MYSQL_ROOT_PASSWORD: hrm_local_root_password
    ports:
      - "3307:3306"
    volumes:
      - hrm_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    build:
      context: ./hrm-backend
      dockerfile: Dockerfile
    container_name: hrm-backend-dev
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/HRM?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: hrm_user
      DB_PASSWORD: hrm_local_password
      CORS_ALLOWED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174,http://192.168.8.116:5174
      APP_DOMAIN: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    build:
      context: ./hrm-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_WS_URL: http://localhost:8080/ws
    container_name: hrm-frontend-dev
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  hrm_mysql_data:
