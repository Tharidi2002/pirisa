services:
  backend:
    build:
      context: ./hrm-backend
      dockerfile: Dockerfile
    container_name: hrm-backend
    restart: unless-stopped
    network_mode: host
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://127.0.0.1:3306/hrm_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in the production environment}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the production environment}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms64m -Xmx256m -XX:MaxMetaspaceSize=96m -XX:MaxDirectMemorySize=32m -Xss256k}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-3}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-1}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the production environment}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APP_DOMAIN: ${APP_DOMAIN:-http://167.172.95.86}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://167.172.95.86,http://pirisahr.com,https://pirisahr.com,http://www.pirisahr.com,https://www.pirisahr.com}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    mem_limit: 380m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  frontend:
    build:
      context: ./hrm-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://167.172.95.86}
        VITE_WS_URL: ${PUBLIC_WS_URL:-http://167.172.95.86/ws}
    container_name: hrm-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
